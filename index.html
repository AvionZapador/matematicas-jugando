<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Matemáticas Jugando · IES Santa Engracia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f7f2e7;
  --paper-line:#cfe0e8;
  --margin-red:#e2857a;
  --ink:#1f3a5f;
  --ink-soft:#4a6382;
  --coral:#e85d4c;
  --coral-dark:#c8442f;
  --correct:#4c9a6a;
  --correct-dark:#357a4d;
  --wrong:#d1483f;
  --card:#fffdf7;
  --shadow: 0 6px 0 rgba(31,58,95,0.12);
  --app-height: 100%;
}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;}
body{
  font-family:'Nunito',sans-serif;
  background:
    repeating-linear-gradient(to bottom, transparent, transparent 35px, var(--paper-line) 36px),
    var(--paper);
  min-height:var(--app-height,100vh);
  color:var(--ink);
  overflow-x:hidden;
  position:relative;
}
body::before{
  content:"";
  position:fixed; top:0; bottom:0; left:38px; width:2px;
  background:var(--margin-red); opacity:.55; z-index:0;
  pointer-events:none;
}
h1,h2,h3,.hand{font-family:'Caveat',cursive; font-weight:700;}
.screen{
  min-height:100vh; min-height:var(--app-height,100vh);
  display:none; flex-direction:column; align-items:center; justify-content:center;
  padding:24px 20px 40px; position:relative; z-index:1;
}
.screen.active{display:flex;}
.card{
  background:var(--card); border-radius:18px; box-shadow:var(--shadow);
  border:2px solid rgba(31,58,95,0.08);
  padding:32px 28px; max-width:480px; width:100%;
}
.title-hero{font-size:3.2rem; line-height:1; color:var(--coral); text-align:center; margin:0 0 4px;}
.subtitle{color:var(--ink-soft); text-align:center; margin:0 0 24px; font-weight:600;}
input[type=text]{
  width:100%; padding:14px 16px; border-radius:12px; border:2px solid #d8cdb8;
  font-family:'Nunito',sans-serif; font-size:1.05rem; margin-bottom:16px; background:#fffef9;
}
input[type=text]:focus{outline:none; border-color:var(--coral);}
select{
  width:100%; padding:12px 14px; border-radius:12px; border:2px solid #d8cdb8;
  font-family:'Nunito',sans-serif; font-size:1rem; font-weight:700; background:#fffef9; color:var(--ink);
}
select:focus{outline:none; border-color:var(--coral);}
button{
  font-family:'Nunito',sans-serif; font-weight:800; cursor:pointer; border:none;
  border-radius:12px; transition:transform .08s ease, box-shadow .08s ease;
}
button:active{transform:translateY(2px);}
.btn-primary{
  width:100%; padding:15px; font-size:1.1rem; color:#fff; background:var(--coral);
  box-shadow:0 5px 0 var(--coral-dark);
}
.btn-primary:active{box-shadow:0 2px 0 var(--coral-dark);}
.btn-primary:disabled{background:#c9c2b0; box-shadow:0 5px 0 #a89f89; cursor:not-allowed;}
.btn-ghost{
  background:transparent; color:var(--ink-soft); font-weight:700; padding:10px 14px; font-size:.95rem;
  text-decoration:underline; text-underline-offset:3px;
}
.topbar{
  position:fixed; top:0; left:0; right:0; display:flex; justify-content:space-between;
  align-items:center; padding:14px 18px; z-index:5; pointer-events:none;
}
.topbar > *{pointer-events:auto;}
.pill{background:var(--card); border-radius:999px; padding:8px 16px; box-shadow:var(--shadow); font-weight:800; font-size:1rem; color:var(--ink);}
.icon-btn{
  background:var(--card); border-radius:999px; width:44px; height:44px; box-shadow:var(--shadow);
  display:flex; align-items:center; justify-content:center; font-size:1.3rem;
}
.levels-grid{
  display:grid; grid-template-columns:repeat(auto-fit, minmax(200px,1fr)); gap:16px; width:100%; max-width:900px;
}
.level-card{
  background:var(--card); border-radius:16px; padding:20px 16px; box-shadow:var(--shadow);
  border:2px solid rgba(31,58,95,0.08); text-align:center; cursor:pointer; position:relative;
}
.level-card:hover{transform:translateY(-3px);}
.level-card .emoji{font-size:2.4rem; display:block; margin-bottom:8px;}
.level-card .name{font-weight:800; font-size:1.05rem;}
.level-card .upload{
  position:absolute; top:8px; right:8px; font-size:1.1rem; opacity:.55; width:30px; height:30px;
  border-radius:50%; display:flex; align-items:center; justify-content:center;
}
.level-card .upload:hover{opacity:1; background:#f0ead9;}
.level-card input[type=file]{display:none;}
.level-card.custom-loaded{border-color:var(--correct);}
.progress-wrap{width:100%; max-width:640px; height:14px; background:#e7e0cf; border-radius:99px; margin-bottom:28px; overflow:hidden;}
.progress-bar{height:100%; background:var(--coral); width:0%; transition:width .3s ease;}
.q-card{width:100%; max-width:640px;}
.illustration{display:flex; justify-content:center; margin-bottom:14px;}
.illustration svg{width:140px; height:auto; max-height:120px;}
.q-statement{font-size:1.5rem; font-weight:800; text-align:center; margin-bottom:24px; line-height:1.3;}
.level-card.teacher{border-color:var(--coral); background:#fff8f2;}
.options{display:grid; gap:12px;}
.opt-btn{
  padding:16px 18px; background:#fffef9; border:2px solid #d8cdb8; border-radius:14px;
  font-size:1.05rem; font-weight:700; text-align:left; color:var(--ink); position:relative;
}
.opt-btn .mark{float:right; font-size:1.2rem;}
.opt-btn.correct{background:#e6f4ea; border-color:var(--correct); color:var(--correct-dark);}
.opt-btn.wrong{background:#fbe8e6; border-color:var(--wrong); color:var(--wrong);}
.opt-btn:disabled{cursor:default;}
.end-emoji{font-size:3.5rem; text-align:center; margin-bottom:6px;}
.stat-row{display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px dashed #d8cdb8; font-weight:700;}
.stat-row:last-child{border-bottom:none;}
.stat-row span.v{color:var(--coral);}
.settings-panel{
  position:fixed; inset:0; background:rgba(31,38,50,.45); display:none; align-items:center; justify-content:center; z-index:20; padding:20px;
}
.settings-panel.active{display:flex;}
.settings-box{background:var(--card); border-radius:18px; padding:26px; max-width:380px; width:100%; box-shadow:0 10px 40px rgba(0,0,0,.25);}
.settings-box label{display:block; font-weight:700; margin:14px 0 6px; font-size:.95rem;}
.row{display:flex; align-items:center; justify-content:space-between; margin-bottom:6px;}
.toggle{width:46px; height:26px; background:#d8cdb8; border-radius:99px; position:relative; cursor:pointer; flex:none;}
.toggle::after{content:""; position:absolute; width:20px; height:20px; background:#fff; border-radius:50%; top:3px; left:3px; transition:.2s;}
.toggle.on{background:var(--correct);}
.toggle.on::after{left:23px;}
.file-label{
  display:block; text-align:center; padding:10px; border:2px dashed #c9bfa6; border-radius:10px; font-weight:700; color:var(--ink-soft); cursor:pointer; margin-top:6px; font-size:.9rem;
}
.file-label input{display:none;}
.footer-note{color:var(--ink-soft); font-size:.85rem; text-align:center; margin-top:18px;}
@media (max-width:480px){
  .title-hero{font-size:2.4rem;}
  .q-statement{font-size:1.25rem;}
}
</style>
</head>

function parseCSVText(text){
  const rows = []; let row = [], field = '', inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(inQuotes){
      if(c === '"'){ if(text[i+1] === '"'){ field += '"'; i++; } else { inQuotes = false; } }
      else field += c;
    } else {
      if(c === '"') inQuotes = true;
      else if(c === ','){ row.push(field); field=''; }
      else if(c === '\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else if(c === '\r'){ /* skip */ }
      else field += c;
    }
  }
  if(field.length>0 || row.length>0){ row.push(field); rows.push(row); }
  return rows;
}
function parseTeacherCSV(text){
  const rows = parseCSVText(text).filter(r=>r.some(c=>c.trim()!==''));
  if(rows.length===0) return {title:'', questions:[]};
  const title = (rows[0][0]||'').trim();
  const questions = rows.slice(1).map(r=>{
    const cells = r.map(c=>c.trim()).filter(c=>c!=='');
    return {statement: cells[0], options: cells.slice(1), correctIndex: 0};
  }).filter(q=>q.statement && q.options.length>=3);
  return {title, questions};
}
const TEACHER_TXT_URL = "https://raw.githubusercontent.com/AvionZapador/matematicas-jugando/refs/heads/main/matematicas.txt";

function parseQuestions(raw){
  return raw.split('\n').map(l=>l.trim()).filter(Boolean).map(line=>{
    const parts = line.split(';').map(p=>p.trim());
    const statement = parts[0];
    const rawOpts = parts.slice(1);
    let correctIndex = rawOpts.findIndex(o=>o.startsWith('*'));
    if(correctIndex === -1) correctIndex = 0;
    const options = rawOpts.map(o=> o.startsWith('*') ? o.slice(1).trim() : o);
    return {statement, options, correctIndex};
  }).filter(q=>q.options.length>=3);
}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

let qIndex = 0;
let correctCount = 0;
let wrongCount = 0;
let startTime = 0;
let timerInterval = null;
let musicOn = true;

/* ---------------- Screens ---------------- */
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

/* ---------------- Login ---------------- */
document.getElementById('btn-continue').addEventListener('click', ()=>{
  const val = document.getElementById('input-name').value.trim();
  if(!val){ document.getElementById('input-name').focus(); return; }
  playerName = val;
  playerCurso = document.getElementById('select-curso').value;
  playerGrupo = document.getElementById('select-grupo').value;
  document.getElementById('pill-name').textContent = `👤 ${playerName} · ${playerCurso} ${playerGrupo}`;
  buildLevelsGrid();
  startMusic();
  showScreen('screen-level');
});
document.getElementById('input-name').addEventListener('keydown', e=>{
  if(e.key === 'Enter') document.getElementById('btn-continue').click();
});

/* ---------------- Level select ---------------- */
function buildLevelsGrid(){
  const grid = document.getElementById('levels-grid');
  grid.innerHTML = '';
  Object.keys(RAW_BANKS).forEach(key=>{
    const t = RAW_BANKS[key];
    const isTeacher = key === 'profesor';
    const card = document.createElement('div');
    card.className = 'level-card' + (customBanks[key] ? ' custom-loaded' : '') + (isTeacher ? ' teacher' : '');
    card.innerHTML = `
      <div class="upload" title="${isTeacher ? 'Subir el archivo descargado de Drive (.txt)' : 'Cargar preguntas propias (.txt)'}">📄
        <input type="file" accept=".txt" data-topic="${key}">
      </div>
      <span class="emoji">${t.emoji}</span>
      <div class="name">${t.name}</div>`;
    card.addEventListener('click', (e)=>{
      if(e.target.closest('.upload')) return;
      if(isTeacher) startTeacherRound(); else startRound(key);
    });
    const fileInput = card.querySelector('input[type=file]');
    card.querySelector('.upload').addEventListener('click', (e)=>{ e.stopPropagation(); fileInput.click(); });
    fileInput.addEventListener('click', e=>e.stopPropagation());
    fileInput.addEventListener('change', e=>{
      const file = e.target.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = ev=>{
        customBanks[key] = ev.target.result;
        buildLevelsGrid();
      };
      reader.readAsText(file);
    });
    grid.appendChild(card);
  });
}

/* ---------------- Ilustraciones ---------------- */
function pieSlicesPath(cx, cy, r, startAngle, endAngle){
  const toXY = a => [cx + r*Math.cos(a), cy + r*Math.sin(a)];
  const [x1,y1] = toXY(startAngle), [x2,y2] = toXY(endAngle);
  const large = (endAngle-startAngle) > Math.PI ? 1 : 0;
  return `M${cx},${cy} L${x1},${y1} A${r},${r} 0 ${large} 1 ${x2},${y2} Z`;
}
function fractionPie(num, den){
  den = Math.max(2, Math.min(12, den||2));
  num = Math.max(0, Math.min(den, num||1));
  const cx=60, cy=60, r=52;
  let paths = '';
  const step = (2*Math.PI)/den;
  for(let i=0;i<den;i++){
    const a0 = -Math.PI/2 + i*step, a1 = a0+step;
    const filled = i < num;
    paths += `<path d="${pieSlicesPath(cx,cy,r,a0,a1)}" fill="${filled?'#e85d4c':'#fff3e6'}" stroke="#c8442f" stroke-width="1.5"/>`;
  }
  return `<svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="54" fill="#8a5a34"/>${paths}</svg>`;
}

      <path d="M64,45 Q86,5 108,45" stroke="#e85d4c" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
      <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#e85d4c"/></marker></defs></svg>`,

      <text x="65" y="45" font-size="10" fill="#4a6382">hipotenusa</text></svg>`,
    profesor: `<svg viewBox="0 0 160 90"><circle cx="80" cy="30" r="18" fill="#f2c14e"/><rect x="45" y="52" width="70" height="34" rx="10" fill="#4a6382"/><text x="60" y="76" font-size="24">🧑‍🏫</text></svg>`

/* ---------------- Preguntas del Profesor (Google Drive) ---------------- */
async function startTeacherRound(){
  try{
    const res = await fetch(TEACHER_CSV_URL, {cache:'no-store'});
    if(!res.ok) throw new Error('bad status');
    const text = await res.text();
    const {title, questions} = parseTeacherCSV(text);
    if(!questions.length) throw new Error('empty');
    teacherParsedQuestions = questions;
    RAW_BANKS.profesor.name = title || "Preguntas del Profesor";
    buildLevelsGrid();
    startRound('profesor');
  }catch(err){
    if(customBanks['profesor']){ startRound('profesor'); return; }
    alert(
      'No se han podido cargar las preguntas del profesor desde Google Sheets ahora mismo ' +
      '(revisa la conexión o que la hoja siga compartida como "Cualquier persona con el enlace: Lector").\n\n' +
      'Como alternativa, puedes subir un archivo .txt con el formato habitual (enunciado;opción1;opción2;...;*correcta) ' +
      'pulsando el icono 📄 de esta tarjeta.'
    );
  }
}

/* ---------------- Game ---------------- */
function startRound(topicKey){
  currentTopicKey = topicKey;
  let parsed;
  if(topicKey === 'profesor' && teacherParsedQuestions && teacherParsedQuestions.length){
    parsed = teacherParsedQuestions;
  } else {
    const raw = customBanks[topicKey] || RAW_BANKS[topicKey].text;
    parsed = parseQuestions(raw);
  }
  let all = shuffle(parsed);
  roundQuestions = all.map(q=>{
    const opts = q.options.map((text,i)=>({text, isCorrect: i===q.correctIndex}));
    return {statement:q.statement, options: shuffle(opts)};
  });
  qIndex = 0; correctCount = 0; wrongCount = 0;
  startTime = Date.now();
  document.getElementById('pill-score').textContent = '✅ 0';
  clearInterval(timerInterval);
  timerInterval = setInterval(updateTimer, 250);
  showScreen('screen-game');
  renderQuestion();
}

function updateTimer(){
  const s = Math.floor((Date.now()-startTime)/1000);
  const m = Math.floor(s/60), sec = s%60;
  document.getElementById('pill-timer').textContent = `⏱ ${m}:${sec.toString().padStart(2,'0')}`;
}

function renderQuestion(){
  const q = roundQuestions[qIndex];
  document.getElementById('progress-bar').style.width = (qIndex/roundQuestions.length*100)+'%';
  document.getElementById('q-statement').textContent = q.statement;
  document.getElementById('q-illustration').innerHTML = buildIllustration(currentTopicKey, q.statement);
  const wrap = document.getElementById('q-options');
  wrap.innerHTML = '';
  q.options.forEach(opt=>{
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.textContent = opt.text;
    btn.addEventListener('click', ()=>answer(opt, btn));
    wrap.appendChild(btn);
  });
}

function answer(opt, btnEl){
  const buttons = document.querySelectorAll('#q-options .opt-btn');
  buttons.forEach(b=>b.disabled = true);
  if(opt.isCorrect){
    btnEl.classList.add('correct');
    btnEl.innerHTML += '<span class="mark">✔️</span>';
    correctCount++;
    playTone(true);
  } else {
    btnEl.classList.add('wrong');
    btnEl.innerHTML += '<span class="mark">✘</span>';
    wrongCount++;
    playTone(false);
    buttons.forEach(b=>{
      if(b.textContent.trim() === roundQuestions[qIndex].options.find(o=>o.isCorrect).text){
        b.classList.add('correct');
      }
    });
  }
  document.getElementById('pill-score').textContent = '✅ ' + correctCount;
  setTimeout(()=>{
    qIndex++;
    if(qIndex >= roundQuestions.length){ finishRound(); }
    else { renderQuestion(); }
  }, 950);
}

function finishRound(){
  clearInterval(timerInterval);
  document.getElementById('progress-bar').style.width = '100%';
  const totalSec = Math.floor((Date.now()-startTime)/1000);
  const m = Math.floor(totalSec/60), s = totalSec%60;
  const timeStr = `${m}:${s.toString().padStart(2,'0')}`;
  document.getElementById('end-name').textContent = playerName;
  document.getElementById('end-curso').textContent = `${playerCurso} ${playerGrupo}`;
  document.getElementById('end-topic').textContent = RAW_BANKS[currentTopicKey].name;
  document.getElementById('end-correct').textContent = correctCount + ' / ' + roundQuestions.length;
  document.getElementById('end-wrong').textContent = wrongCount;
  document.getElementById('end-time').textContent = timeStr;
  document.getElementById('end-emoji').textContent = correctCount === roundQuestions.length ? '🏆' : (correctCount >= roundQuestions.length/2 ? '🎉' : '💪');
  window._shareText = `${playerName} (${playerCurso} ${playerGrupo}) ha completado "${RAW_BANKS[currentTopicKey].name}" en Matemáticas Jugando: ${correctCount}/${roundQuestions.length} aciertos en ${timeStr}. #IESSantaEngracia`;
  showScreen('screen-end');
}

document.getElementById('btn-cancel-game').addEventListener('click', ()=>{
  if(confirm('¿Seguro que quieres cancelar la partida y volver al menú?')){
    clearInterval(timerInterval);
    showScreen('screen-level');
  }
});
document.getElementById('btn-again').addEventListener('click', ()=> startRound(currentTopicKey));
document.getElementById('btn-menu').addEventListener('click', ()=> showScreen('screen-level'));
document.getElementById('btn-share').addEventListener('click', async ()=>{
  const text = window._shareText || '';
  if(navigator.share){
    try{ await navigator.share({text}); }catch(e){}
  } else {
    try{
      await navigator.clipboard.writeText(text);
      alert('Resultado copiado al portapapeles ✅');
    }catch(e){ alert(text); }
  }
});

/* ---------------- Settings ---------------- */
document.getElementById('btn-settings-open').addEventListener('click', ()=> document.getElementById('settings-panel').classList.add('active'));
document.getElementById('btn-settings-close').addEventListener('click', ()=> document.getElementById('settings-panel').classList.remove('active'));
document.getElementById('toggle-music').addEventListener('click', function(){
  musicOn = !musicOn;
  this.classList.toggle('on', musicOn);
  if(musicOn) startMusic(); else stopMusic();
});
document.getElementById('input-music').addEventListener('change', e=>{
  const file = e.target.files[0];
  if(!file) return;
  stopMusic();
  const url = URL.createObjectURL(file);
  customAudio = new Audio(url);
  customAudio.loop = true;
  if(musicOn) customAudio.play().catch(()=>{});
});

/* ---------------- Music: simple procedural 8-bit melody + optional custom mp3 ---------------- */
let audioCtx = null;
let customAudio = null;
let melodyTimeouts = [];
const MELODY = [
  ['C5',.25],['E5',.25],['G5',.25],['E5',.25],
  ['A5',.25],['G5',.25],['E5',.25],['C5',.25],
  ['D5',.25],['F5',.25],['A5',.25],['F5',.25],
  ['G5',.5]
];
const NOTE_FREQ = {C5:523.25,D5:587.33,E5:659.25,F5:698.46,G5:783.99,A5:880.0,B5:987.77};

function playMelodyLoop(){
  if(!musicOn || customAudio) return;
  if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  let t = audioCtx.currentTime;
  melodyTimeouts.forEach(clearTimeout); melodyTimeouts = [];
  let cursor = 0;
  MELODY.forEach(([note,dur])=>{
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'square';
    osc.frequency.value = NOTE_FREQ[note];
    gain.gain.setValueAtTime(0.05, t+cursor);
    gain.gain.exponentialRampToValueAtTime(0.001, t+cursor+dur*0.9);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t+cursor);
    osc.stop(t+cursor+dur);
    cursor += dur;
  });
  const totalDur = MELODY.reduce((a,[,d])=>a+d,0);
  melodyTimeouts.push(setTimeout(playMelodyLoop, totalDur*1000));
}
function startMusic(){
  if(!musicOn) return;
  if(customAudio){ customAudio.play().catch(()=>{}); return; }
  try{ playMelodyLoop(); }catch(e){}
}
function stopMusic(){
  melodyTimeouts.forEach(clearTimeout); melodyTimeouts = [];
  if(customAudio) customAudio.pause();
}
function playTone(good){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.value = good ? 880 : 220;
    gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+0.3);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime+0.3);
  }catch(e){}
}
</script>
